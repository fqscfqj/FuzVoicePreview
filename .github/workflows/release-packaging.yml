name: Package Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install PyAV for Python 3.10
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=av --target FuzVoicePreview/vendor/site-packages-py310 av

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyAV for Python 3.11
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=av --target FuzVoicePreview/vendor/site-packages-py311 av

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyAV for Python 3.12
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=av --target FuzVoicePreview/vendor/site-packages-py312 av

      - name: Build release package
        shell: pwsh
        run: |
          python .github/scripts/package_release.py --version "${{ github.event.release.tag_name }}" --output-dir artifacts

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/FuzVoicePreview-release-*.zip
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}